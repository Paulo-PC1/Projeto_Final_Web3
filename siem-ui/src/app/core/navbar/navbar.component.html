<nav class="navbar" *ngIf="auth.isLoggedIn()">

  <div class="container">
    <div class="p-grid">
      <div class="p-col-12">
        <a href="javascript:;" class="navbar-toggle" (click)="displayingMenu = !displayingMenu">
          <i class="pi pi-bars"></i></a>
      </div>
    </div>
  </div>

  <ul class="navbar-menu" [hidden]="!displayingMenu">
    <li class="navbar-user">{{ auth.jwtPayload?.sub }}</li>
    <li class="navbar-menuitem">
      <a routerLink="/categories" (click)="displayingMenu = false">Categorias</a>
    </li>
    <li class="navbar-menuitem">
      <a href="javascript:;" (click)="logout()">Sair</a>
    </li>
  </ul>

</nav>
