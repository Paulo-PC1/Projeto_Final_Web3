<div class="container">

  <div class="p-col-12">
    <h1>Categorias de Exercícios</h1>
  </div>

  <div class="p-grid">
    <div class="p-col-12">
      <p-table [value]="categories" responsiveLayout="stack" [breakpoint]="'768px'">
        <ng-template pTemplate="header">
          <tr>
            <th>Nome</th>
            <th>Descrição</th>
            <th class="col-actions-header"></th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-category>
          <tr>
            <td>{{ category.categoryName }}</td>
            <td>{{ category.description }}</td>
            <td class="col-actions">
              <a pButton icon="pi pi-pencil" pTooltip="Editar" tooltipPosition="top"
                [routerLink]="['/categories', category.id]"></a>
              <button pButton icon="pi pi-trash" pTooltip="Excluir" tooltipPosition="top"
                (click)="confirmRemoval(category)"></button>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
    <div class="p-col-12">
      <p><a pButton label="Nova Categoria" routerLink="/categories/new"></a></p>
    </div>
  </div>
</div>
