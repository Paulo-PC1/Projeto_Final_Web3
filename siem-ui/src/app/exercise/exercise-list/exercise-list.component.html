<div class="container page">

  <h1>Exercícios</h1>

  <p-table [value]="exercises" responsiveLayout="stack" [breakpoint]="'768px'">
    <ng-template pTemplate="header">
      <tr>
        <th scope="col">Enunciado</th>
        <th scope="col">Operação</th>
        <th scope="col">Categoria</th>
        <th scope="col">Resposta correta</th>
        <th scope="col">Situação</th>
        <th scope="col" class="col-actions-header" *ngIf="showActions">
          <span class="visually-hidden">Ações</span>
        </th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-exercise>
      <tr>
        <td>{{ exercise.statement }}</td>
        <td>{{ exercise.operation }}</td>
        <td>{{ exercise.categoryId?.categoryName }}</td>
        <td>{{ exercise.correctAnswer }}</td>
        <td>
          <span class="badge" [class.badge-off]="!exercise.active">
            {{ exercise.active ? 'Ativo' : 'Inativo' }}
          </span>
        </td>
        <td class="col-actions" *ngIf="showActions">
          <!-- Cada botão só existe para quem tem a permissão correspondente.
               Os aria-label dão nome aos botões que só têm ícone. -->
          <a *ngIf="auth.hasPermission(perm.REGISTER_EXERCISE)" pButton icon="pi pi-pencil"
            pTooltip="Editar" tooltipPosition="top"
            [attr.aria-label]="'Editar exercício: ' + summary(exercise)"
            [routerLink]="['/exercises', exercise.id]"></a>

          <button *ngIf="auth.hasPermission(perm.REGISTER_EXERCISE)" pButton type="button"
            [icon]="exercise.active ? 'pi pi-eye-slash' : 'pi pi-eye'"
            [pTooltip]="exercise.active ? 'Desativar' : 'Ativar'" tooltipPosition="top"
            [attr.aria-label]="(exercise.active ? 'Desativar' : 'Ativar') + ' exercício: ' + summary(exercise)"
            (click)="toggleActive(exercise)"></button>

          <button *ngIf="auth.hasPermission(perm.REMOVE_EXERCISE)" pButton type="button"
            icon="pi pi-trash" pTooltip="Excluir" tooltipPosition="top"
            [attr.aria-label]="'Excluir exercício: ' + summary(exercise)"
            (click)="confirmRemoval(exercise)"></button>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="6">Nenhum exercício cadastrado.</td>
      </tr>
    </ng-template>
  </p-table>

  <p *ngIf="auth.hasPermission(perm.REGISTER_EXERCISE)">
    <a pButton label="Novo Exercício" routerLink="/exercises/new"></a>
  </p>

</div>
